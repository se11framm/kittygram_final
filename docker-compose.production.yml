version: '3.8'

services:
  db:
    image: postgres:13.10
    env_file: .env
    volumes:
      - pg_data_kittygram:/var/lib/postgresql/data
    restart: always

  backend:
    image: <DOCKER_USERNAME>/kittygram_backend:latest
    env_file: .env
    depends_on:
      - db
    volumes:
      - static_value:/backend_static/
      - media_value:/app/media/
    restart: always

  frontend:
    image: <DOCKER_USERNAME>/kittygram_frontend:latest
    env_file: .env
    command: cp -r /app/build/. /frontend_static/
    volumes:
      - static_value:/frontend_static/

  gateway:
    image: <DOCKER_USERNAME>/kittygram_gateway:latest
    env_file: .env
    restart: always
    ports:
      - "9000:80"
    volumes:
      - static_value:/static/
      - media_value:/media/
    depends_on:
      - backend
      - frontend

volumes:
  pg_data_kittygram:
  static_value:
  media_value:
